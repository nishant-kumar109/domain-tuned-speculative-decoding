# QLoRA Fine-tuning Config — TinyLlama-1.1B on CodeSearchNet

model:
  base_model_id: "TinyLlama/TinyLlama-1.1B-intermediate-step-1431k-3T"
  load_in_4bit: true
  bnb_4bit_compute_dtype: "float16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

lora:
  r: 16                          # rank
  lora_alpha: 32
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

data:
  source: "codesearchnet"        # "codesearchnet" | "the_stack" | "combined"
  max_seq_length: 512
  train_split_fraction: 1.0      # fraction of CodeSearchNet (0.1/0.5/1.0 for ablations)
  stack_samples: 200000          # max samples from The Stack (used when source includes it)

training:
  output_dir: "./checkpoints/tinyllama-qlora-code"
  num_train_epochs: 2
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4  # effective batch = 16
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  fp16: true
  logging_steps: 50
  save_steps: 500
  save_total_limit: 2
  report_to: "wandb"
  run_name: "tinyllama-qlora-code-full"
